[package]
name = "tauri-plugin-passkeys"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "Ключи доступа через системный менеджер учётных данных Android"
links = "tauri-plugin-passkeys"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
