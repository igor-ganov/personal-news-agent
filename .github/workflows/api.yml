name: API

# В Worker живут аккаунты и ключи доступа, поэтому непроверенным туда не
# попадает ничего: сначала проверки, потом публикация, и только с ветки по
# умолчанию.
on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pna/api typecheck
      - name: Тесты API
        run: pnpm vitest run --project api

  # Ветка по умолчанию берётся у самого репозитория, а не зашивается именем:
  # называться она может как угодно, а публиковать надо именно с неё.
  deploy:
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Условие уровня job не видит секретов, поэтому наличие доступа
      # выясняется шагом. Без токена прогон не падает: код проверен, а
      # публиковать просто нечем — это настройка, а не поломка.
      - name: Есть ли доступ к Cloudflare
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секрета CLOUDFLARE_API_TOKEN нет — публикация Worker пропущена"
          fi

      # Миграции идут первыми: новый код может опираться на таблицы, которых в
      # старой схеме нет, а миграции D1 только добавляют.
      - name: Миграции D1
        if: steps.guard.outputs.configured == 'true'
        working-directory: services/api
        run: pnpm exec wrangler d1 migrations apply pna --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Публикация Worker
        if: steps.guard.outputs.configured == 'true'
        working-directory: services/api
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Деплой, отвечающий 404, хуже упавшего с ошибкой.
      - name: Проверка после публикации
        if: steps.guard.outputs.configured == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS https://pna-api.igor-ganov.workers.dev/health) && break
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"ok":true'
