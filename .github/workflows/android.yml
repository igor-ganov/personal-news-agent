name: Android

# Проверяет, что APK собирается на чистой машине, и — если в репозитории есть
# ключ подписи — подписывает его и кладёт в релиз.
#
# Ключа в этом репозитории нет и быть не может: он публичный, а ключ подписи в
# публичном репозитории означает, что кто угодно соберёт APK, который Android
# примет как обновление установленного приложения. Поэтому подпись здесь —
# необязательный шаг: без секрета сборка остаётся артефактом прогона, а готовый
# подписанный APK приезжает в ветку `dist` уже подписанным (см. `publish-apk`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Раз в неделю — чтобы поломка сборки нашлась раньше, чем она понадобится.
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Значения сборки заданы прямо здесь, а не переменными репозитория: их всего
  # два, они не секретны, и так их видно вместе с остальной конфигурацией.
  PUBLIC_PNA_API_URL: https://pna-api.igor-ganov.workers.dev
  PUBLIC_PNA_DIAGRAMS: "off"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Кеш сборки Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mobile/src-tauri/target
          key: android-cargo-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - run: pnpm install --frozen-lockfile

      # В релиз не должно уехать то, что не проходит проверки.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Сборка APK
        # Раннеры ubuntu уже несут SDK и NDK — ставить их отдельно не нужно.
        # Проект Gradle в репозитории не хранится: он целиком воспроизводится
        # из конфигурации, поэтому на чистом раннере его сначала надо создать.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          [ -d apps/mobile/src-tauri/gen/android ] || pnpm android:init
          pnpm android:build

      # Ключ приходит через окружение, а не через командную строку: аргументы
      # видны в списке процессов раннера, переменные окружения — нет.
      - name: Подпись
        id: sign
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PNA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/pna-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          PNA_KEYSTORE="$keystore" scripts/sign-apk.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Публикация релиза
        if: ${{ steps.sign.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=apps/mobile/src-tauri/gen/android/app/build/outputs/apk/personal-news-agent.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --title "Личный агент $TAG" --generate-notes
          fi

      - name: Где взять подписанный APK
        if: ${{ steps.sign.outputs.signed != 'true' }}
        run: |
          echo "::notice::Ключа подписи в секретах нет — APK остался неподписанным и лежит в артефактах прогона. Подписанная сборка публикуется через ветку dist."
