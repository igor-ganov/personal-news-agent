name: Android

# Собирает APK, подписывает его и кладёт в релиз.
#
# Подпись — не деталь оформления: Android ставит обновление поверх только если
# оно подписано тем же ключом. Поэтому ключ живёт в секретах репозитория, а не
# рождается на раннере.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (по умолчанию — версия приложения и номер сборки)"
        required: false
        type: string
      prerelease:
        description: "Пометить релиз как черновой"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Кеш сборки Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mobile/src-tauri/target
          key: android-cargo-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - run: pnpm install --frozen-lockfile

      # В релиз не должно уехать то, что не проходит проверки.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Сборка APK
        env:
          PUBLIC_PNA_API_URL: ${{ vars.PUBLIC_PNA_API_URL }}
          PUBLIC_PNA_DIAGRAMS: ${{ vars.PUBLIC_PNA_DIAGRAMS }}
        # Раннеры ubuntu уже несут SDK и NDK — ставить их отдельно не нужно.
        # Проект Gradle в репозитории не хранится: он целиком воспроизводится
        # из конфигурации, поэтому на чистом раннере его сначала надо создать.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          [ -d apps/mobile/src-tauri/gen/android ] || pnpm android:init
          pnpm android:build

      # Ключ приходит через окружение, а не через командную строку: аргументы
      # видны в списке процессов раннера, переменные окружения — нет.
      - name: Подпись
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PNA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — подписать APK нечем"
            exit 1
          fi
          keystore="$RUNNER_TEMP/pna-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          trap 'rm -f "$keystore"' EXIT
          PNA_KEYSTORE="$keystore" scripts/sign-apk.sh

      - name: Имя релиза
        id: naming
        run: |
          version="$(node -p "require('./apps/mobile/package.json').version")"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
              *) tag="v$version-build.$GITHUB_RUN_NUMBER" ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.naming.outputs.tag }}
        run: |
          apk=apps/mobile/src-tauri/gen/android/app/build/outputs/apk/personal-news-agent.apk
          size="$(du -h "$apk" | cut -f1)"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          fingerprint="$("$tools/apksigner" verify --print-certs "$apk" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')"

          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<MSG
          Сборка из \`${GITHUB_SHA:0:7}\`.

          | | |
          | --- | --- |
          | Пакет | \`dev.ganov.pna\` |
          | Архитектура | arm64-v8a, minSdk 24 |
          | Размер | $size |
          | Отпечаток подписи | \`$fingerprint\` |

          Отпечаток должен совпадать с тем, что отдаёт
          [assetlinks.json](https://pna-api.igor-ganov.workers.dev/.well-known/assetlinks.json) —
          иначе система не свяжет приложение с доменом и вход по ключу не сработает.
          MSG

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" \
              --title "Личный агент $TAG" \
              --notes-file "$notes" \
              ${{ inputs.prerelease && '--prerelease' || '' }}
          fi
