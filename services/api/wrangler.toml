name = "pna-api"
main = "src/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

# The Relying Party id passkeys are bound to. Changing it invalidates every
# credential already registered, so treat it as permanent.
[vars]
RP_ID = "pna-api.igor-ganov.workers.dev"
RP_NAME = "Личный агент"
ALLOWED_ORIGINS = "https://pna-api.igor-ganov.workers.dev,http://localhost:4321,http://tauri.localhost"
ANDROID_PACKAGE_NAME = "dev.ganov.pna"
# SHA-256 отпечаток ключа, которым подписан APK. Подпишете другим ключом —
# Credential Manager перестанет узнавать приложение, и вход по ключу отвалится.
ANDROID_CERT_FINGERPRINTS = "7A:26:19:0E:62:01:26:D8:DE:16:C8:DD:26:63:94:EC:1B:3F:68:AC:30:45:B1:08:8F:0C:46:DA:0A:C8:05:60"

[[d1_databases]]
binding = "DB"
database_name = "pna"
database_id = "774adde6-a754-468e-b1d3-ddf7d5f4f3fb"

# Every five minutes: pick up generation whose invocation died. Daily at 03:00:
# expire challenges and sessions, drop long-finished jobs.
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]
